name: zcodec
description: Dependency-free pure Dart codecs for DEFLATE, zlib, GZIP, TAR, and ZIP data.
version: 0.2.1
homepage: https://github.com/focale-editor/zcodec
repository: https://github.com/focale-editor/zcodec

topics:
  - compression
  - archive
  - zip
  - gzip
  - codec

screenshots:
  - description: 'A flat illustration of compression and archive codecs.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dev_dependencies:
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.31.2

release:
  changelog:
    header: '# 📰 ZCodec changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
