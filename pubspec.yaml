name: zcodec
description: Dependency-free pure Dart codecs for DEFLATE, zlib, and ZIP data.
version: 0.1.0
homepage: https://github.com/focale-editor/zcodec
repository: https://github.com/focale-editor/zcodec

environment:
  sdk: '>=3.13.0 <4.0.0'

dev_dependencies:
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.31.2

release:
  changelog:
    header: '# 📰 ZCodec changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
